<!-- @dsCard group="Brand" height=300 subtitle="Lockup, mark and tiles on both grounds" -->
<div class="cde-root" style="display:grid;grid-template-columns:1fr 1fr;min-height:300px;">
  <style>
    .lg-pane { display:flex; flex-direction:column; gap:var(--space-8); padding:var(--space-8); background:var(--surface); color:var(--ink-muted); min-width:0; }
    .lg-row { display:flex; align-items:center; gap:var(--space-8); flex-wrap:wrap; }
    .lg-cap { font:400 11px/16px var(--font-sans); color:var(--ink-muted); }
    .lg-tile { width:32px; height:32px; }
    .lg-live { font:700 20px/24px var(--font-wordmark); letter-spacing:0.06em; color:var(--ink); text-transform:uppercase; }
  </style>
  <div class="lg-pane">
    <div class="lg-row"><img src="../../assets/Logos/cde-lockup.svg" alt="CAN Data Extract lockup" height="28"></div>
    <div class="lg-row">
      <img src="../../assets/Logos/cde-mark.svg" alt="Mark" width="32" height="32">
      <img src="../../assets/Logos/cde-mark-ink.svg" alt="Mark, ink" width="32" height="32">
      <img class="lg-tile" src="../../assets/Logos/cde-favicon.svg" alt="Favicon">
      <img src="../../assets/Logos/cde-favicon.svg" alt="Favicon at 16px" width="16" height="16">
      <img src="../../assets/Logos/cde-mark.svg" alt="Mark at 16px" width="16" height="16">
      <img src="../../assets/Logos/cde-short.svg" alt="CDE" height="18">
    </div>
    <div class="lg-row"><span class="lg-live">CAN Data Extract</span><span class="lg-cap">wordmark style, live text</span></div>
    <div class="lg-cap">Light ground: cde-lockup.svg, cde-mark.svg, cde-favicon.svg</div>
  </div>
  <div class="lg-pane" data-theme="dark">
    <div class="lg-row"><img src="../../assets/Logos/cde-lockup-paper-trace.svg" alt="CAN Data Extract lockup, dark" height="28"></div>
    <div class="lg-row">
      <img src="../../assets/Logos/cde-mark-dark.svg" alt="Mark, dark" width="32" height="32">
      <img src="../../assets/Logos/cde-mark-paper.svg" alt="Mark, paper" width="32" height="32">
      <img class="lg-tile" src="../../assets/Logos/cde-favicon.svg" alt="Favicon">
      <img src="../../assets/Logos/cde-app-icon.svg" alt="App icon" width="48" height="48">
      <img src="../../assets/Logos/cde-mark-dark.svg" alt="Mark at 16px, dark" width="16" height="16">
      <img src="../../assets/Logos/cde-short-paper.svg" alt="CDE, paper" height="18">
    </div>
    <div class="lg-row"><span class="lg-live">CAN Data Extract</span><span class="lg-cap">wordmark style, live text</span></div>
    <div class="lg-cap">Dark ground: cde-lockup-paper-trace.svg, cde-mark-dark.svg, cde-app-icon.svg</div>
  </div>
</div>
